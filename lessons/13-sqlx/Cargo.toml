[package]
name = "sqlx-tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
